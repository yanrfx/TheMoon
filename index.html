<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TheMoon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at top, #35406b, #10152b 55%, #050711);
    }

    .box {
      width: 90%;
      max-width: 650px;
      padding: 50px 25px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    h1 {
      margin: 0 0 15px;
      font-size: 52px;
    }

    p {
      margin: 0;
      color: #d6daf0;
      font-size: 18px;
      line-height: 1.6;
    }

    .moon {
      margin-bottom: 20px;
      font-size: 80px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="moon">🌙</div>
    <h1>TheMoon</h1>
    <p>Website pertama saya berhasil online menggunakan Cloudflare Pages.</p>
  </div>
</body>
</html>
